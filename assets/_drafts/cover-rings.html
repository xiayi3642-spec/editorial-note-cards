<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8">
<title>cover-rings</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  @font-face{font-family:'Didot';src:url('../../fonts/Didot.ttf') format('truetype');font-weight:400;font-style:normal;}
  @font-face{font-family:'Didot';src:url('../../fonts/Didot-Bold.ttf') format('truetype');font-weight:700;font-style:normal;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1080px;height:1440px;overflow:hidden;font-family:'Didot','Times New Roman',serif;}
  .bg{position:absolute;inset:0;background:url('../media/bg-rings.jpg') center/cover no-repeat;}
  .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,28,44,.50),rgba(14,18,28,.46));z-index:1;}
  .top{position:absolute;top:40px;left:26px;right:26px;display:flex;justify-content:space-between;color:#fff;font-size:22px;letter-spacing:.08em;z-index:3;}
  .midline-upper{position:absolute;top:470px;left:0;right:0;text-align:center;z-index:3;}
  .en-line{color:#fff;font-size:34px;letter-spacing:.06em;text-shadow:0 2px 10px rgba(0,0,0,.55);}
  .byline{color:rgba(255,255,255,.9);font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.3em;margin-top:16px;}
  .title{position:absolute;top:600px;left:0;right:0;text-align:center;color:#fff;font-family:'Noto Serif SC','Songti SC','SimSun',serif;font-weight:700;z-index:2;}
  .zh{font-size:150px;line-height:1.14;letter-spacing:.08em;max-width:820px;margin:0 auto;text-shadow:0 3px 14px rgba(0,0,0,.6),0 2px 2px rgba(0,0,0,.5);}
  .foot{position:absolute;bottom:90px;left:0;right:0;display:flex;justify-content:space-between;padding:0 120px;color:#fff;font-size:24px;letter-spacing:.12em;z-index:3;text-shadow:0 2px 8px rgba(0,0,0,.5);}
</style></head><body>
  <div class="bg"></div><div class="veil"></div>

  </div>
  <div class="title"><div class="zh" id="zh">系统与工程系统</div></div>
  <div class="foot"><span>Holism</span><span>Hierarchy</span><span>Emergence</span></div>
</body>
<script>
(function(){var zh=document.getElementById('zh');if(!zh)return;var t=zh.textContent.trim().replace(/[\s\u3000]/g,'');var n=t.length;var fs=150;if(n>=10)fs=76;else if(n>=8)fs=86;else if(n>=7)fs=96;else if(n>=6)fs=112;else if(n===5)fs=132;else fs=150;zh.style.fontSize=fs+'px';})();
