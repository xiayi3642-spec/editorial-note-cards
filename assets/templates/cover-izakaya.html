<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>封面 · 大阪霓虹（垫图版式 · 非明朝体）</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  @font-face{font-family:'Didot';src:url('../fonts/Didot.ttf') format('truetype');font-weight:400;font-style:normal;}
  @font-face{font-family:'Didot';src:url('../fonts/Didot-Bold.ttf') format('truetype');font-weight:700;font-style:normal;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1080px;height:1440px;overflow:hidden;font-family:'Didot','Times New Roman',serif;}
  /* 背景垫图：暖黄螺旋光学纹理 */
  .bg{position:absolute;inset:0;background:url('../media/bg-izakaya.jpg') center/cover no-repeat;}
  /* 深酒红压暗罩层：撑高文字对比，保留螺旋观感 */
  .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,5,7,.60) 0%,rgba(54,12,15,.30) 40%,rgba(20,6,8,.55) 100%);z-index:1;}
  /* 顶部双英文小字（Didot，月黄） */
  .top{position:absolute;top:40px;left:26px;right:26px;display:flex;justify-content:space-between;color:#FECD6D;font-size:22px;letter-spacing:.08em;z-index:3;}
  /* 中上英文句 + 小标 */
  .midline-upper{position:absolute;top:470px;left:0;right:0;text-align:center;z-index:3;}
  .en-line{color:#fff;font-size:34px;letter-spacing:.06em;}
  .byline{color:#FECD6D;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.3em;margin-top:16px;}
  /* 中部大中文（宋体 Noto Serif SC）；字号按字数自适应 */
  .title{position:absolute;top:600px;left:0;right:0;text-align:center;color:#fff;font-family:'Noto Serif SC','Songti SC','SimSun',serif;font-weight:700;z-index:2;}
  .zh{font-size:150px;line-height:1.14;letter-spacing:.08em;max-width:820px;margin:0 auto;text-shadow:0 4px 18px rgba(10,3,4,.55),0 2px 2px rgba(0,0,0,.45);}
  /* 底部三英文词分列（Didot，月黄） */
  .foot{position:absolute;bottom:90px;left:0;right:0;display:flex;justify-content:space-between;padding:0 120px;color:#FECD6D;font-size:24px;letter-spacing:.12em;z-index:3;}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="veil"></div>
  <!-- ↓ 以下均为可替换占位：顶部左右英文、中上英文句、小标、标题、底部三词 -->
  <div class="top"><span>SCUT · MEM</span><span>Chapter 02</span></div>
  <div class="midline-upper">
    <div class="en-line">Systems thinking, in neon hues</div>
    <div class="byline">ENGINEERING MANAGEMENT</div>
  </div>
  <div class="title"><div class="zh" id="zh">系统与工程系统</div></div>
  <div class="foot"><span>Holism</span><span>Hierarchy</span><span>Emergence</span></div>
</body>
<script>
// 标题字号自适应：字少字号大、字多适当缩小并自动换行（max-width 已限宽）
(function(){
  var zh=document.getElementById('zh');
  if(!zh) return;
  var t=zh.textContent.trim().replace(/[\s\u3000]/g,'');
  var n=t.length;
  var fs=150;
  if(n>=10) fs=76;
  else if(n>=8) fs=86;
  else if(n>=7) fs=96;
  else if(n>=6) fs=112;
  else if(n===5) fs=132;
  else fs=150;
  zh.style.fontSize=fs+'px';
})();
</script>
</html>
