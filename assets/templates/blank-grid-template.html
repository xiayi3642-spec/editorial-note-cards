<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>细方格空白页 · Grid Notes</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Playfair+Display:wght@500&family=Noto+Serif+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  :root{
    --green:#5a8c3f; --ink:#292A19; --gray:#7a7a6a;
    --cream:#FAF6E8; --edge:#4a7c3a; --highlight:#FFF200;
    --grid:20px;                 /* 细方格边长：20px ≈ 4mm */
    --grid-line:rgba(74,124,58,.22);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1080px;height:1440px;font-family:'Noto Serif SC','Songti SC','SimSun',serif;}
  .bg{position:absolute;inset:0;background:linear-gradient(180deg,#5E8F43 0%,#69A24D 25%,#C8D8A0 65%,#F4EED0 100%);}
  .frame{position:absolute;inset:24px;border:1.5px solid rgba(255,255,255,.4);border-radius:20px;}
  .t1{position:absolute;top:22px;left:32px;right:32px;display:flex;justify-content:space-between;color:#fff;font-family:'Noto Sans SC',sans-serif;font-size:15px;font-weight:600;letter-spacing:.05em;}
  .rule{position:absolute;top:54px;left:32px;right:32px;border-top:1px solid rgba(255,255,255,.3);}
  .t2{position:absolute;top:86px;left:32px;right:32px;display:flex;justify-content:space-between;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;}
  .bot{position:absolute;bottom:18px;left:32px;right:32px;display:flex;justify-content:space-between;color:rgba(255,255,255,.9);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;}
  .card{position:absolute;top:190px;left:105px;right:105px;bottom:136px;background:var(--cream);border:1.5px solid var(--edge);border-radius:12px;box-shadow:0 16px 44px rgba(22,60,20,.22);padding:42px 52px;display:flex;flex-direction:column;}
  /* 细方格纸张：铺满整张奶油卡（含内边距），横竖双向重复渐变，1px 细线 */
  .grid{position:absolute;inset:0 0 64px 0;border-radius:12px 12px 0 0;overflow:hidden;pointer-events:none;
    background-image:
      linear-gradient(to right,var(--grid-line) 0 1px,transparent 1px),
      linear-gradient(to bottom,var(--grid-line) 0 1px,transparent 1px);
    background-size:var(--grid) var(--grid);}
  .kicker{position:absolute;z-index:2;top:40px;left:52px;background:var(--cream);padding:2px 8px 2px 0;font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--green);font-weight:500;}
  .foot{position:absolute;left:52px;right:52px;bottom:16px;background:var(--cream);border-top:1px solid rgba(74,124,58,.3);padding-top:14px;display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);z-index:2;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="frame">
  <div class="t1"><span>SCUT · MEM</span><span>—— 工程管理导论 · Ch.02</span></div>
  <div class="rule"></div>
  <div class="t2"><span>CHAPTER 02 / FREE NOTES</span><span>10 / 10</span></div>
  <div class="bot"><span>Engineering Management · CH.02</span><span>SCUT MEM</span></div>
</div>
<div class="card">
  <div class="grid"></div>
  <div class="kicker">NOTES · FREE SPACE</div>
  <div class="foot"><span>Chapter 02</span><span>Blank · Grid</span></div>
</div>
</body>
</html>
