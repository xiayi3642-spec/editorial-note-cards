<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>封面 · 紫色雪山（垫图版式）</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Playfair+Display:wght@500&family=Noto+Serif+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  @font-face{font-family:'Huiwen';src:url('../fonts/Huiwen-mincho.otf') format('opentype');font-weight:400;font-style:normal;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1080px;height:1440px;font-family:'Noto Serif SC','Songti SC','SimSun',serif;}
  /* 背景垫图（黑紫泼墨+雪山，1080×1440 同比例） */
  .bg{position:absolute;inset:0;background-image:url('../media/bg-xueshan-purple.jpg');background-size:cover;background-position:center;}
  /* 外层框 */
  .frame{position:absolute;inset:24px;border:1.5px solid rgba(255,255,255,.5);border-radius:20px;}
  .t1{position:absolute;top:22px;left:32px;right:32px;display:flex;justify-content:space-between;color:#fff;font-family:'Noto Sans SC',sans-serif;font-size:15px;font-weight:600;letter-spacing:.05em;}
  .rule{position:absolute;top:54px;left:32px;right:32px;border-top:1px solid rgba(255,255,255,.4);}
  .t2{position:absolute;top:86px;left:32px;right:32px;display:flex;justify-content:space-between;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;}
  .bot{position:absolute;bottom:18px;left:32px;right:32px;display:flex;justify-content:space-between;color:rgba(255,255,255,.9);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;}
  /* 居中标题区 */
  .center{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 96px;}
  .top{font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.28em;color:#fff;font-weight:500;}
  .tsep{width:56px;height:2px;background:rgba(255,255,255,.55);margin:34px auto;}
  .zh{font-size:112px;font-weight:500;color:#fff;line-height:1.14;letter-spacing:.02em;font-family:'Huiwen','Noto Serif SC','Songti SC','SimSun',serif;}
  .en{font-family:'Playfair Display','Georgia',serif;font-size:25px;color:rgba(255,255,255,.94);margin-top:20px;letter-spacing:.04em;}
  .sub{font-size:19px;line-height:1.9;color:rgba(255,255,255,.94);margin-top:34px;max-width:780px;}
  .views{margin-top:56px;display:flex;flex-direction:column;gap:20px;width:100%;}
  .v .row{font-size:20px;font-weight:500;color:#fff;}
  .v .row .no{font-family:'Playfair Display','Georgia',serif;color:#C9B8FF;margin-right:6px;}
  .v .d{font-size:14px;color:rgba(255,255,255,.85);margin-top:4px;line-height:1.6;}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="frame">
    <div class="t1"><span>SCUT · MEM</span><span>—— 占位说明</span></div>
    <div class="rule"></div>
    <div class="t2"><span>KICKER · UPPERCASE</span><span>01 / 03</span></div>
    <div class="bot"><span>Field Guide · Example</span><span>SCUT MEM</span></div>
  </div>
  <div class="center">
    <div class="top">KICKER · UPPERCASE</div>
    <div class="tsep"></div>
    <div class="zh" id="zh">主标题占位</div>
    <div class="en">English Subtitle Placeholder</div>
    <div class="sub">副题占位：以赛事海报为背景试排的 Editorial 竖版笔记卡模板</div>
    <div class="views">
      <div class="v"><div class="row"><span class="no">01</span>板块一</div><div class="d">要点一 · 要点二 · 要点三</div></div>
      <div class="v"><div class="row"><span class="no">02</span>板块二</div><div class="d">要点一 · 要点二 · 要点三</div></div>
      <div class="v"><div class="row"><span class="no">03</span>板块三</div><div class="d">要点一 · 要点二 · 要点三</div></div>
    </div>
  </div>
</body>
<script>
// 标题字号自适应：字少字号大、字多适当缩小并自动换行（max-width 已限宽）
(function(){
  var zh=document.getElementById('zh');
  if(!zh) return;
  var t=zh.textContent.trim().replace(/[\s\u3000]/g,'');
  var n=t.length;
  var fs=112;
  if(n>=10) fs=68;
  else if(n>=8) fs=76;
  else if(n===7) fs=84;
  else if(n>=5) fs=96;
  else fs=112;
  zh.style.fontSize=fs+'px';
})();
</script>
</html>
