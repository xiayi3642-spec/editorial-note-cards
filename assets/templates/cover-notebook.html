<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>封面 · 红布面笔记本</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Playfair+Display:wght@500&family=Noto+Serif+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  @font-face{
    font-family:'JinghuaSongti';
    src:url('../media/../fonts/jinghua-songti.ttf') format('truetype');
    font-weight:400;
    font-display:block;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1080px;height:1440px;position:relative;font-family:'Noto Serif SC','Songti SC',serif;font-style:normal;overflow:hidden;}
  .bg{position:absolute;inset:0;background:url('../media/bg-notebook-cover.jpg') center center / cover no-repeat;}
  .cover-text{position:absolute;top:380px;left:120px;right:80px;display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff;}
  .tag{font-family:'IBM Plex Mono','Courier New',monospace;font-size:14px;letter-spacing:.3em;color:rgba(255,255,255,.75);text-transform:uppercase;}
  .line{width:60px;height:1px;background:rgba(255,255,255,.5);margin:28px 0;}
  h1{font-family:'JinghuaSongti','Noto Serif SC','Songti SC',serif;font-size:100px;font-weight:400;line-height:1.25;letter-spacing:.1em;}
  .en{font-family:'Playfair Display','Georgia',serif;font-size:24px;margin-top:24px;letter-spacing:.05em;color:rgba(255,255,255,.8);}
  .sub{font-size:17px;margin-top:14px;color:rgba(255,255,255,.65);letter-spacing:.1em;}
  .bottom{position:absolute;bottom:60px;left:120px;right:80px;display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.15em;color:rgba(255,255,255,.45);text-transform:uppercase;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="cover-text">
  <div class="tag">SCUT · MEM</div>
  <div class="line"></div>
  <h1>课程名</h1>
  <div class="en">Course English Title</div>
  <div class="sub">Ch.XX</div>
</div>
<div class="bottom"><span>Chapter XX</span><span>2026</span></div>
</body>
</html>
