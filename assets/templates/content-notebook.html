<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>内容页 · 红布面笔记本</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Playfair+Display:wght@500&family=Noto+Serif+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1080px;height:1440px;position:relative;font-family:'Noto Serif SC','Songti SC',serif;font-style:normal;overflow:hidden;}
  .bg{position:absolute;inset:0;background:url('../media/bg-notebook-inner.jpg') center center / cover no-repeat;}
  .page{position:absolute;top:290px;left:75px;right:75px;bottom:70px;display:flex;flex-direction:column;}
  .kicker{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.25em;color:#B8281C;text-transform:uppercase;font-weight:500;}
  h1{font-size:40px;font-weight:500;color:#2A2520;margin-top:14px;line-height:1.15;}
  .sub{font-size:15px;color:#B8281C;margin-top:6px;}
  .body{flex:1;margin-top:24px;display:flex;flex-direction:column;gap:26px;}
  .sec .lbl{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid rgba(184,40,28,.3);padding-bottom:8px;margin-bottom:12px;}
  .sec .no{font-family:'Playfair Display',serif;font-size:20px;color:#B8281C;}
  .sec .t{font-size:19px;font-weight:500;color:#2A2520;}
  .sec .an{font-size:12px;color:#9A8E82;margin-left:auto;}
  .lead{font-size:15px;line-height:1.8;color:#3A3530;}
  .lead b{color:#B8281C;font-weight:600;}
  .hl{position:relative;display:inline;z-index:0;isolation:isolate;}
  .hl::after{content:"";position:absolute;z-index:-1;left:-.04em;right:-.04em;top:calc(30% + 2px);height:.65em;background:#E9B445;opacity:.45;border-radius:.04em;transform:rotate(-.3deg);}
  .feat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .f{border:1px solid rgba(184,40,28,.25);border-radius:6px;padding:10px 12px;}
  .f .t{font-size:15px;font-weight:500;color:#2A2520;}
  .f .d{font-size:11px;color:#8A8078;margin-top:3px;line-height:1.4;}
  .cls{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .cl{border:1px solid rgba(184,40,28,.25);border-radius:6px;padding:12px 14px;}
  .cl .abbr{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:#B8281C;}
  .cl .t{font-size:16px;font-weight:500;margin-top:4px;color:#2A2520;}
  .cl .d{font-size:12px;color:#8A8078;margin-top:3px;line-height:1.4;}
  .quote{border-left:3px solid #B8281C;background:rgba(184,40,28,.06);padding:14px 18px;}
  .quote p{font-size:14px;line-height:1.7;color:#3A3530;}
  .foot{margin-top:auto;padding-top:12px;border-top:1px solid rgba(184,40,28,.2);display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;color:#9A8E82;text-transform:uppercase;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="page">
  <div class="kicker">CHAPTER XX / SECTION</div>
  <h1>章节标题</h1>
  <div class="sub">Subtitle</div>
  <div class="body">
    <div class="sec">
      <div class="lbl"><span class="no">Ⅰ</span><span class="t">板块标题</span><span class="an">注解</span></div>
      <p class="lead">正文内容……<span class="hl">重点短语</span>。</p>
    </div>
  </div>
  <div class="foot"><span>03 / 05</span><span>Section</span></div>
</div>
</body>
</html>
