<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>封面 · 未来薯地计划</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Playfair+Display:wght@500&family=Noto+Serif+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1080px;height:1440px;font-family:'Noto Serif SC','Songti SC','SimSun',serif;}
  .bg{position:absolute;inset:0;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.85) 0 2px, transparent 2px 16px),
      linear-gradient(180deg,#EAF4FB 0%,#D6EAF8 100%);
  }
  .frame{position:absolute;inset:24px;border:1.5px solid rgba(62,155,255,.45);border-radius:20px;}
  .t1{position:absolute;top:22px;left:32px;right:32px;display:flex;justify-content:space-between;color:#3E9BFF;font-family:'Noto Sans SC',sans-serif;font-size:15px;font-weight:600;letter-spacing:.05em;}
  .rule{position:absolute;top:54px;left:32px;right:32px;border-top:1px solid rgba(62,155,255,.35);}
  .t2{position:absolute;top:86px;left:32px;right:32px;display:flex;justify-content:space-between;color:#3E9BFF;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;}
  .bot{position:absolute;bottom:18px;left:32px;right:32px;display:flex;justify-content:space-between;color:rgba(62,155,255,.85);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;}
  /* 居中封面区 */
  .center{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 96px;}
  .top{font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.28em;color:#3E9BFF;font-weight:500;}
  .tsep{width:56px;height:2px;background:rgba(62,155,255,.55);margin:34px auto;}
  h1{font-size:96px;font-weight:700;color:#5C2A1E;line-height:1.16;letter-spacing:.04em;}
  .en{font-family:'Playfair Display','Georgia',serif;font-size:26px;color:#B5651D;margin-top:22px;letter-spacing:.06em;}
  .sub{font-size:19px;line-height:1.9;color:#2C3E50;margin-top:30px;max-width:780px;}
  /* 副标题框（呼应参考图「共建邀约书」的小框） */
  .badge{display:inline-block;margin-top:40px;padding:14px 46px;border:1.5px solid #B5651D;border-radius:6px;color:#B5651D;font-size:24px;font-weight:600;letter-spacing:.3em;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="frame">
  <div class="t1"><span>XIAOHONGSHU</span><span>—— 未来薯地计划 · 共建邀约</span></div>
  <div class="rule"></div>
  <div class="t2"><span>FUTURE POTATO LAND</span><span>01 / 03</span></div>
  <div class="bot"><span>Co-construction Invitation</span><span>XHS · Teen Mode</span></div>
</div>
<div class="center">
  <div class="top">XIAOHONGSHU · TEEN MODE</div>
  <div class="tsep"></div>
  <h1>未来薯地计划</h1>
  <div class="en">Future Potato Land</div>
  <div class="sub">邀请全国媒体、出版、博物馆、高校、科普美育与公益教育机构<br>一起为未成年人模式带来更多好内容</div>
  <div class="badge">共建邀约书</div>
</div>
</body>
</html>
