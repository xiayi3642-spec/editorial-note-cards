<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>封面 · 未来薯地计划（原版式复刻）</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Playfair+Display:wght@500;700&family=Noto+Serif+SC:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1080px;height:1440px;font-family:'Noto Serif SC','Songti SC','SimSun',serif;position:relative;overflow:hidden;}
  .bg{position:absolute;inset:0;background:url('media/bg-patato.jpg') center/cover no-repeat;}
  .frame{position:absolute;inset:24px;border:1.5px solid rgba(62,155,255,.4);border-radius:20px;}

  /* 红色胶囊 logo */
  .logo{position:absolute;top:96px;left:50%;transform:translateX(-50%);
    background:#FF2442;color:#fff;font-family:'Noto Sans SC',sans-serif;font-weight:900;
    font-size:34px;padding:10px 34px;border-radius:999px;letter-spacing:.05em;}

  /* 小行文案 + 黄色月牙括号 */
  .tagline{position:absolute;top:290px;left:50%;transform:translateX(-50%);
    color:#B5651D;font-size:32px;font-weight:500;letter-spacing:.18em;
    display:flex;align-items:center;gap:18px;}
  .tagline .paren{font-size:52px;color:#F5B841;font-weight:700;line-height:1;font-family:'Noto Sans SC',sans-serif;}

  /* 巨大标题 */
  .hero{position:absolute;top:380px;left:0;right:0;text-align:center;
    color:#5C2A1E;font-weight:900;line-height:1.02;letter-spacing:.02em;}
  .hero .l1{font-size:200px;}
  .hero .l2{font-size:240px;margin-top:10px;letter-spacing:.04em;}

  /* 蓝色左括号（「形：竖线 + 右上短横） */
  .br-l{position:absolute;top:400px;left:96px;width:14px;height:170px;background:#3E9BFF;border-radius:3px;}
  .br-l::before{content:"";position:absolute;top:0;left:0;width:70px;height:14px;background:#3E9BFF;border-radius:3px;}
  /* 蓝色右括号（」形：竖线 + 左下短横） */
  .br-r{position:absolute;top:830px;right:130px;width:14px;height:140px;background:#3E9BFF;border-radius:3px;}
  .br-r::before{content:"";position:absolute;bottom:0;right:0;width:70px;height:14px;background:#3E9BFF;border-radius:3px;}
  /* 蓝色星号 */
  .star{position:absolute;top:790px;left:240px;color:#3E9BFF;font-size:64px;font-weight:900;line-height:1;font-family:'Noto Sans SC',sans-serif;}

  /* 共建邀约书：邮戳式蓝框 */
  .invite{position:absolute;top:1000px;left:50%;transform:translateX(-50%);
    border:2px solid #3E9BFF;padding:26px 70px;background:rgba(255,255,255,.55);}
  .invite::before,.invite::after{content:"";position:absolute;width:14px;height:14px;background:#3E9BFF;}
  .invite::before{top:-8px;left:-8px;}
  .invite::after{bottom:-8px;right:-8px;}
  .invite .corner2,.invite .corner3{position:absolute;width:14px;height:14px;background:#3E9BFF;}
  .invite .corner2{top:-8px;right:-8px;}
  .invite .corner3{bottom:-8px;left:-8px;}
  .invite .txt{color:#B5651D;font-size:64px;font-weight:700;letter-spacing:.12em;}

  /* INVITATION 英文 */
  .inv-en{position:absolute;top:1140px;left:0;right:0;text-align:center;
    color:#B5651D;font-family:'Playfair Display',serif;font-size:38px;font-weight:500;letter-spacing:.35em;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="frame"></div>

<div class="logo">小红书</div>
<div class="tagline"><span class="paren">(</span><span>方寸有护 · 成长在场</span><span class="paren">)</span></div>

<div class="br-l"></div>
<div class="star">*</div>
<div class="br-r"></div>

<div class="hero">
  <div class="l1">未来薯地</div>
  <div class="l2">计划</div>
</div>

<div class="invite">
  <span class="corner2"></span><span class="corner3"></span>
  <span class="txt">共建邀约书</span>
</div>
<div class="inv-en">INVITATION</div>
</body>
</html>
