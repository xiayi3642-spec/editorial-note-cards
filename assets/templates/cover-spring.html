<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>封面 · 春日新绿（垫图版式）</title>
<style>
  @font-face{font-family:'Didot';src:url('../fonts/Didot.ttf') format('truetype');font-weight:400;font-style:normal;}
  @font-face{font-family:'Didot';src:url('../fonts/Didot-Bold.ttf') format('truetype');font-weight:700;font-style:normal;}
  @font-face{font-family:'Huiwen';src:url('../fonts/Huiwen-mincho.otf') format('opentype');font-weight:400;font-style:normal;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1080px;height:1440px;overflow:hidden;font-family:'Didot','Times New Roman',serif;}
  /* 背景垫图（黄绿动态模糊，1080×1440 同比例） */
  .bg{position:absolute;inset:0;background:url('../media/bg-spring.jpg') center/cover no-repeat;}
  /* 顶部双英文小字（可替换） */
  .top{position:absolute;top:40px;left:26px;right:26px;display:flex;justify-content:space-between;color:#fff;font-size:21px;letter-spacing:.06em;z-index:3;}
  /* 中上英文句 + 小标（可替换） */
  .midline-upper{position:absolute;top:470px;left:0;right:0;text-align:center;z-index:3;}
  .en-line{color:#fff;font-size:32px;letter-spacing:.05em;}
  .byline{color:rgba(255,255,255,.85);font-size:13px;letter-spacing:.3em;margin-top:14px;}
  /* 白色流线装饰（ribbon.svg），文字下层 */
  .ribbon{position:absolute;top:540px;left:0;width:1080px;height:303px;z-index:1;}
  .ribbon svg,.ribbon img{display:block;width:100%;height:100%;}
  /* 中部大中文（回文明朝体），流线上层；字号按字数自适应（字少大、字多缩小换行） */
  .title{position:absolute;top:640px;left:0;right:0;text-align:center;color:#fff;font-family:'Huiwen','Songti SC','SimSun',serif;z-index:2;}
  .zh{font-size:150px;line-height:1.12;letter-spacing:.06em;max-width:820px;margin:0 auto;text-shadow:0 6px 30px rgba(20,60,30,.35);}
  /* 底部三英文词分列（可替换） */
  .foot{position:absolute;bottom:90px;left:0;right:0;display:flex;justify-content:space-between;padding:0 120px;color:rgba(255,255,255,.95);font-size:24px;letter-spacing:.1em;z-index:3;}
</style>
</head>
<body>
  <div class="bg"></div>
  <!-- ↓ 以下均为可替换占位：顶部左右英文、中上英文句、小标、标题、底部三词 -->
  <div class="top"><span>Chunlv</span><span>Xinsheng</span></div>
  <div class="midline-upper">
    <div class="en-line">The spring breeze blows by</div>
    <div class="byline">@GAODING</div>
  </div>
  <div class="ribbon"><img src="../media/ribbon.svg" alt=""></div>
  <div class="title"><div class="zh" id="zh">春绿·新生</div></div>
  <div class="foot"><span>Renewal</span><span>Sprout</span><span>Verdant</span></div>
</body>
<script>
// 标题字号自适应：字少字号大、字多适当缩小并自动换行（max-width 已限宽）
(function(){
  var zh=document.getElementById('zh');
  if(!zh) return;
  var t=zh.textContent.trim().replace(/[\s\u3000]/g,'');
  var n=t.length;
  var fs=150;
  if(n>=10) fs=76;
  else if(n>=8) fs=86;
  else if(n>=7) fs=96;
  else if(n>=6) fs=112;
  else if(n===5) fs=132;
  else fs=150;
  zh.style.fontSize=fs+'px';
})();
</script>
</html>
