<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>封面 · 油画随笔（垫图版式）</title>
<style>
  @font-face{font-family:'Didot';src:url('assets/fonts/Didot.ttf') format('truetype');font-weight:400;font-style:normal;}
  @font-face{font-family:'Didot';src:url('assets/fonts/Didot-Bold.ttf') format('truetype');font-weight:700;font-style:normal;}
  @font-face{font-family:'Huiwen';src:url('assets/fonts/Huiwen-mincho.otf') format('opentype');font-weight:400;font-style:normal;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1080px;height:1440px;overflow:hidden;font-family:'Didot','Times New Roman',serif;}
  /* 背景垫图：印象派油画笔触 */
  .bg{position:absolute;inset:0;background:url('assets/media/bg-painting.jpg') center/cover no-repeat;}
  /* 顶部双英文小字 */
  .top{position:absolute;top:46px;left:40px;right:40px;display:flex;justify-content:space-between;color:#054204;font-size:21px;letter-spacing:.08em;z-index:3;font-weight:400;}
  /* 中上英文句 + 小标 */
  .midline-upper{position:absolute;top:470px;left:0;right:0;text-align:center;z-index:3;}
  .en-line{color:#054204;font-size:30px;letter-spacing:.06em;font-style:normal;}
  .byline{color:rgba(5,66,4,.7);font-size:13px;letter-spacing:.32em;margin-top:16px;}
  /* 标题下细短线 */
  .tline{width:64px;height:1.5px;background:#1D6517;margin:36px auto 0;}
  /* 中部大中文（回文明朝体） */
  .title{position:absolute;top:600px;left:0;right:0;text-align:center;color:#054204;font-family:'Huiwen','Songti SC','SimSun',serif;z-index:2;}
  .zh{font-size:150px;line-height:1.12;letter-spacing:.08em;max-width:820px;margin:0 auto;}
  /* 底部三英文词分列 */
  .foot{position:absolute;bottom:90px;left:0;right:0;display:flex;justify-content:space-between;padding:0 120px;color:rgba(5,66,4,.95);font-size:22px;letter-spacing:.14em;z-index:3;}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="top"><span>SCUT · MEM</span><span>Chapter 02</span></div>
  <div class="midline-upper">
    <div class="en-line">Systems thinking, painted in soft strokes</div>
    <div class="byline">ENGINEERING MANAGEMENT</div>
    <div class="tline"></div>
  </div>
  <div class="title"><div class="zh" id="zh">系统工程</div></div>
  <div class="foot"><span>Holism</span><span>Hierarchy</span><span>Emergence</span></div>
</body>
<script>
(function(){
  var zh=document.getElementById('zh');
  if(!zh) return;
  var t=zh.textContent.trim().replace(/[\s\u3000]/g,'');
  var n=t.length;
  var fs=150;
  if(n>=10) fs=76;
  else if(n>=8) fs=86;
  else if(n>=7) fs=96;
  else if(n>=6) fs=112;
  else if(n===5) fs=132;
  else fs=150;
  zh.style.fontSize=fs+'px';
})();
</script>
</body>
</html>
